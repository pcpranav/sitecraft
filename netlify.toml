[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  # Extend timeout for AI generation (default is 10s, max 26s on paid)
  external_node_modules = ["@supabase/supabase-js"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Increase function timeout for AI streaming endpoint
[functions."app/api/ai"]
  # Background functions can run up to 15 minutes
  # Standard functions: 10s free, 26s paid
  # We use SSE streaming which keeps the connection alive

[context.production.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
